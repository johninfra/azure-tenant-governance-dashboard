name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      VITE_ENTRA_CLIENT_ID: a1ddc620-0b4e-4295-ad82-2714fd5270bd
      SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_FOREST_0DF58D91E }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Build multitenant dashboard
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Deploy to Azure Static Web Apps
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SWA_DEPLOYMENT_TOKEN:-}" ]; then
            echo "Azure Static Web Apps deployment token is not configured." >&2
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli@latest deploy ./dist \
            --deployment-token "${SWA_DEPLOYMENT_TOKEN}" \
            --env production
